<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws: wss:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; form-action 'none'"><title>AgentRouter 远程控制台</title><style>
:root{--bg:#0f1216;--fg:#e7ecf3;--card:#171b21;--line:#262c36;--mut:#8b98a9;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--acc:#4c8dff}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:5}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}.dot.on{background:var(--ok)}.dot.warn{background:var(--warn)}
h1{font-size:16px;margin:0;flex:1;font-weight:600}.badge{font-size:11px;padding:2px 7px;border-radius:999px;background:#22293a;color:var(--mut)}
main{padding:12px;display:grid;gap:12px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.card h2{font-size:13px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.k{color:var(--mut)}.v{text-align:right}
button{font:inherit;background:var(--acc);color:#05101f;border:0;border-radius:9px;padding:9px 12px;font-weight:600}button.g{background:#22293a;color:var(--fg)}button:disabled{opacity:.45}
input,select,textarea{font:inherit;background:#0b0e12;color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:9px;width:100%}textarea{min-height:140px;resize:vertical}
.st{font-size:11px;padding:2px 7px;border-radius:6px;background:#22293a}.SUCCEEDED{color:var(--ok)}.WAITING_INPUT,.PENDING,.NEEDS_ATTENTION,.UNKNOWN{color:var(--warn)}
nav{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex}nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:12px 4px;font-weight:500}nav button.on{color:var(--acc)}
.err{color:var(--bad);font-size:13px}.hint{color:var(--mut);font-size:12px}.frozen{background:#3a2230;color:#ffb4c0;padding:6px 10px;border-radius:8px;font-size:12px;text-align:center}
.sheet-backdrop{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end}.sheet-backdrop[hidden]{display:none}.sheet{width:100%;max-height:88vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px #0008}.sheet-head,.sheet-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}.sheet-head{border-bottom:1px solid var(--line);padding-bottom:10px}.sheet-head h2{margin:0;font-size:18px}.sheet-body{padding:14px 0}.sheet-actions{border-top:1px solid var(--line);padding-top:12px;justify-content:flex-end}.sheet-actions button{min-height:44px}.readonly{padding:8px;border-radius:8px;background:#2b2530;color:#ffd38a}
</style></head><body>
<header><span class="dot" id="dot"></span><h1>AgentRouter</h1><span class="badge" id="mode">未连接</span><span class="badge" id="lease"></span></header>
<div id="frozen" style="display:none" class="frozen"></div>
<main id="app"></main>
<nav id="nav" style="display:none">
<button data-v="attention" class="on">需处理</button><button data-v="home">运行</button><button data-v="tasks">任务</button><button data-v="roles">角色</button><button data-v="me">控制</button>
</nav>
<div id="sheet" class="sheet-backdrop" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title"></h2><button id="sheet-x" class="g" aria-label="关闭">关闭</button></div><div id="sheet-body" class="sheet-body"></div><div class="sheet-actions"><button id="sheet-cancel" class="g">取消</button><button id="sheet-primary">确认</button></div></section></div>
<script src="/meta.js"></script>
<script>
const $=s=>document.querySelector(s),S={rev:null,cursor:0,lease:null,clientId:'mobile_'+Math.random().toString(36).slice(2),snap:null,lastSnapshotAt:null};
// 配对成功恢复完整页面骨架(renderPair 会整体替换 body)。
const CHROME=document.body.innerHTML;
let ws=null,seq=0,pending={},view='attention',stale=false;
// W07 共享元数据:mutation 标志表来自网关 /meta.js(与 Node 传输同一份 client-contract 生成物)。
function meta(){return window.METHOD_METADATA||{}}
function frame(m,p,o){const id='m'+(++seq);const f={v:1,id,method:m,params:p||{}};const md=(meta()[m]===true);
 if(md||o.operationId){f.client_id=S.clientId;f.operation_id=o.operationId;f.expected_revision=o.expectedRevision;f.scope=o.scope||{};}
 if(o&&o.leaseId)f.lease_id=o.leaseId;
 if(o&&o.requestKey)f.request_key=o.requestKey;
 if(o&&o.preflightHash)f.preflight_hash=o.preflightHash;
 return {id,f};
}
function send(m,p,o){const {id,f}=frame(m,p,o||{});return new Promise((res,rej)=>{pending[id]={res,rej,t:setTimeout(()=>{rej(new Error('TIMEOUT'))},20000)};try{ws.send(JSON.stringify(f)+'\n')}catch(e){rej(e)}})}
function snap(){return send('system.snapshot',{})}
function connect(reason){ws&&ws.close();const proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(proto+'//'+location.host+'/ws');
 ws.onopen=()=>{const d=$('#dot');if(d)d.className='dot on';reconnectAttempts=0};
 ws.onclose=(ev)=>{const d=$('#dot');if(d)d.className='dot';stale=true;S.lease=null;const m=$('#mode');if(m)m.textContent='已断开';renderFrozen();if(ev.code===4003||ev.code===4004){renderPair();return}if(document.getElementById('code'))return;scheduleReconnect()};
 ws.onerror=()=>{const d=$('#dot');if(d)d.className='dot'};
 ws.onmessage=e=>{for(const line of e.data.split('\n')){if(!line.trim())continue;let x;try{x=JSON.parse(line)}catch{continue}
  if(x.attached){S.deviceKind=x.kind;S.canController=!!x.canRequestController;boot();continue}
  // K01:网关提示未认证→立即进配对界面(不读 HttpOnly cookie);close 阻止 K04 重连风暴(退避上限 30s 亦可)。
  if(x.auth_required){try{ws.close()}catch{};renderPair();return}
  if((x.event||x.eventCursor!==undefined)&&S.snap){if(x.cursor!==undefined)S.cursor=x.cursor;scheduleRefresh()}
  if(x.id&&pending[x.id]){const p=pending[x.id];clearTimeout(p.t);delete pending[x.id];x.error?p.rej(Object.assign(new Error(x.error.code),x.error)):p.res(x.result);continue}
 }}}
let reconnectAttempts=0,reconnectTimer=null;
function scheduleReconnect(){clearTimeout(reconnectTimer);const delay=Math.min(30000,1000*Math.pow(2,reconnectAttempts++));reconnectTimer=setTimeout(()=>{if(navigator.onLine!==false)connect()},delay)}
async function boot(){try{const wantMode=S.canController?(localStorage.getItem('ar_mode')||'controller'):(localStorage.getItem('ar_mode')||'observer');const h=await send('system.initialize',{client_protocol:'agentrouter-client/1',client_version:'1.0.0',client_id:S.clientId,requested_mode:wantMode,contract_revision:'C1R1P1'});S.rev=h.revision??null;
 try{const up=await send('contract.upgrade',{revision:'C1R1P2'});if(up&&up.revision)S.revision2=true}catch{}
 $('#mode').textContent=h.connectionState==='CONNECTED_CONTROLLER'?'控制器':'观察者';await refresh()}catch(e){$('#mode').textContent='初始化失败';err(e)}}
function scopeForSpace(sid){const sp=(S.snap.spaces||[]).find(x=>x.id===sid);return {project_id:sp?sp.project_id:undefined,space_id:sid}}
let refreshing=false;function scheduleRefresh(){if(refreshing)return;refreshing=true;setTimeout(async()=>{try{await refresh()}finally{refreshing=false}},300)}
async function refresh(){try{const s=await snap();S.snap=s;S.rev=s.revision;S.cursor=s.cursor;S.lastSnapshotAt=Date.now();stale=false;renderFrozen();render()}catch(e){err(e)}}
function renderFrozen(){const f=$('#frozen');if(!f)return;f.style.display=stale?'block':'none';if(stale)f.textContent='连接中断 · 数据截至 '+(S.lastSnapshotAt?new Date(S.lastSnapshotAt).toLocaleString():'上次快照')+' · 写操作已禁用，正在自动重连'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){$('#nav').style.display='flex';const s=S.snap;const app=$('#app');
 if(view==='home')app.innerHTML=card('概览',row('项目',s.projects.length)+row('角色',s.roles.length)+row('运行中',s.runs.filter(r=>['CREATED','STARTING','RUNNING','WAITING_APPROVAL','SETTLING'].includes(r.state)).length)+row('需处理',s.roles.filter(r=>r.interventionState&&r.interventionState!=='NONE').length)+row('快照修订',s.revision))+(s.roles.length?card('活跃角色',s.roles.slice(0,6).map(r=>row(esc(r.name),'<span class="st">'+esc(r.status)+'</span>')).join('')):'');
 else if(view==='attention'){const need=[];for(const r of s.roles)if(r.interventionState&&r.interventionState!=='NONE')need.push(row(esc(r.name),'需 '+esc(r.interventionState)));for(const t of s.tasks)if(t.state==='WAITING_INPUT'||t.state==='NEEDS_ATTENTION')need.push(row('任务 '+esc(t.summary),t.state==='WAITING_INPUT'?'<button class="g" onclick="openTask(\''+t.id+'\')">回复</button>':'<span class="st NEEDS_ATTENTION">需检查</span>'));for(const a of s.approvals||[])if(a.state==='PENDING')need.push(row('审批 '+esc(a.title||a.id),approve(a)));for(const r of s.runs||[])if(r.state==='UNKNOWN'||r.reconciliationRequired)need.push(row('Run '+esc(r.id),'<span class="st UNKNOWN">UNKNOWN · 请核对，勿盲目重试</span>'));for(const r of s.results||[])if(r.acceptance==='PENDING')need.push(row('结果 '+esc(r.summary),'<span class="st PENDING">等待复核</span>'));app.innerHTML=card('需要关注',need.length?need.join(''):'<div class="hint">当前没有需要你介入的事项。空闲不代表工作已完成。</div>')}
 else if(view==='tasks'){const runByTask={};for(const r of (s.runs||[]))if(['CREATED','STARTING','RUNNING','WAITING_APPROVAL'].includes(r.state))runByTask[r.taskId]=r;app.innerHTML=card('任务',s.tasks.slice(0,40).map(t=>row(esc(t.summary),'<span class="st '+t.state+'">'+esc(t.state)+'</span> '+(runByTask[t.id]&&S.lease?'<button class="g" onclick="cancelRun(\''+runByTask[t.id].id+'\',\''+t.spaceId+'\')">取消</button>':''))).join(''))+card('新任务',`<select id="nr">${s.roles.map(r=>`<option value="${r.id}:${r.spaceId}">${esc(r.name)}</option>`).join('')}</select><input id="nb" placeholder="任务描述"><button ${S.lease?'':'disabled'} onclick="newTask()">派发</button><div class="hint">${S.lease?'':'需先在“控制”获取租约'}</div>`)}
 else if(view==='roles')app.innerHTML=card('角色与会话',s.roles.map(r=>row(esc(r.name),'<button class="g" onclick="openRole(\''+r.id+'\')">会话</button>')).join(''));
 else if(view==='me')app.innerHTML=card('控制权',`<div class="hint">观察者只读；控制器需获取租约（同一时刻仅一名）。</div><div style="display:flex;gap:8px;margin-top:8px"><button ${S.lease?'disabled':''} onclick="acq()">获取控制器</button><button ${S.lease?'':'disabled'} onclick="rel()">释放</button></div><div class="hint">当前:${S.lease?'控制器':'观察者'}</div>`);
}
function card(h,b){return`<section class="card"><h2>${h}</h2>${b}</section>`}
function row(k,v){return`<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`}
function approve(a){return`<button class="g" onclick="openApproval('${a.id}',true)">批准</button> <button class="g" onclick="openApproval('${a.id}',false)">拒绝</button>`}
async function op(fn){try{await fn();await refresh()}catch(e){err(e)}}
function leaseArgs(o){if(!S.lease)throw Object.assign(new Error('CONTROL_LEASE_REQUIRED'));return Object.assign({leaseId:S.lease},o)}
function rid(){return'mcp'+Math.random().toString(36).slice(2,10)}
window.acq=()=>op(async()=>{const r=await send('control.acquire',{},{operationId:rid(),expectedRevision:S.rev,scope:{}});S.lease=r.leaseId;$('#lease').textContent='控制器';$('#mode').textContent='控制器'});
window.rel=()=>op(async()=>{if(S.lease)await send('control.release',{lease_id:S.lease},{operationId:rid(),expectedRevision:S.rev,scope:{},leaseId:S.lease});S.lease=null;$('#lease').textContent='';$('#mode').textContent='观察者'});
window.newTask=()=>{const v=$('#nr').value.split(':');const summary=$('#nb').value.trim();if(!summary)return;op(async()=>{await send('task.submitFromUser',{request:{kind:'task.request',to:{type:'role',id:v[0]},summary,body:summary,inputs:[],expected:['用户验收'],completion:{mode:'result',to:{type:'user'}}}},{operationId:rid(),expectedRevision:S.rev,scope:scopeForSpace(v[1])});$('#nb').value=''})};
function closeSheet(){const sh=$('#sheet');if(sh)sh.hidden=true}
function showSheet(title,body,primaryLabel,onPrimary,disabled){$('#sheet-title').textContent=title;$('#sheet-body').innerHTML=body;const p=$('#sheet-primary');p.textContent=primaryLabel||'确认';p.disabled=!!disabled;p.onclick=async()=>{p.disabled=true;try{await onPrimary();closeSheet()}catch(e){const n=document.createElement('div');n.className='err';n.textContent='操作失败：'+(e&&e.message||e);$('#sheet-body').prepend(n);p.disabled=!!disabled}};$('#sheet').hidden=false;setTimeout(()=>$('#sheet').querySelector('textarea,input,button')?.focus(),0)}
function bindSheet(){if(!$('#sheet'))return;$('#sheet-x').onclick=closeSheet;$('#sheet-cancel').onclick=closeSheet;$('#sheet').onclick=e=>{if(e.target===$('#sheet'))closeSheet()}}
window.openApproval=(id,ok)=>showSheet(ok?'批准请求':'拒绝请求','<p>该决定将由 Core 记录并影响关联 Run。</p>'+(S.lease?'':'<div class="readonly">Observer 模式：需要先取得 Controller 租约。</div>'),ok?'批准':'拒绝',()=>op(()=>send('approval.decide',{id,decision:ok?'APPROVE':'DENY',reason:''},leaseArgs({operationId:rid(),expectedRevision:S.rev,scope:{}}))),!S.lease);
window.cancelRun=(runId,spaceId)=>showSheet('取消 Run','<p>取消会请求 Core 停止当前 Run。结果与 Artifact 状态仍以 Core 后续快照为准。</p>'+(S.lease?'':'<div class="readonly">Observer 模式：写操作已禁用。</div>'),'确认取消',()=>op(()=>send('run.cancel',{id:runId},leaseArgs({operationId:rid(),expectedRevision:S.rev,scope:scopeForSpace(spaceId)}))),!S.lease);
window.openTask=id=>{const t=S.snap.tasks.find(x=>x.id===id);if(!t)return;const key='ar_reply_'+id,draft=localStorage.getItem(key)||'';showSheet('回复等待输入的任务','<p><b>'+esc(t.summary)+'</b></p><p class="hint">回复只关联 Task '+esc(id)+'，发送状态不确定时请先核对。</p><textarea id="sheet-text" placeholder="输入完整回复">'+esc(draft)+'</textarea>'+(S.lease?'':'<div class="readonly">Observer 模式：草稿可保留，不能发送。</div>'),'发送回复',async()=>{const body=$('#sheet-text').value.trim();localStorage.setItem(key,body);if(!body)throw Error('请输入回复内容');await op(()=>send('conversation.sendUserInput',{task_id:id,role_id:t.assigneeRoleId,body},leaseArgs({operationId:rid(),expectedRevision:S.rev,scope:scopeForSpace(t.spaceId)})));localStorage.removeItem(key)},!S.lease)};
window.openRole=async id=>{try{const ls=await send('roleSession.list',{role_id:id});const act=ls.active_session_id;const rows=ls.sessions.map(x=>'<div class="row"><span class="k">W'+esc(x.seq)+' · '+esc(x.name)+'</span><span class="st">'+(x.id===act?'ACTIVE':'Historical · Read-only')+'</span></div>').join('');showSheet('Role WorkSessions','<p class="hint">历史 WorkSession 永久只读，没有 Resume / Continue / Reactivate。</p>'+rows+(S.lease?'':'<div class="readonly">Observer 模式：只能查看。</div>'),'新建 WorkSession',async()=>{const pre=await send('roleSession.preflight',{role_id:id});showSheet('新建 WorkSession','<label>名称<input id="ws-name" maxlength="80" placeholder="例如：新的实现方向"></label><label>Context<select id="ws-context"><option value="blank">Start blank</option><option value="inherit">Transfer from current WorkSession</option></select></label><p class="hint">Context capability: '+esc(pre.migration_fidelity||'UNKNOWN')+'。失败时当前 WorkSession 保持原状态。</p>','创建',async()=>{const name=$('#ws-name').value.trim(),context_mode=$('#ws-context').value;if(!name)throw Error('请输入名称');const requestKey=rid();await op(()=>send('roleSession.create',{role_id:id,name,context_mode},leaseArgs({operationId:requestKey,requestKey,preflightHash:pre.preflight_hash,expectedRevision:S.rev,scope:{}})))},!S.lease)},!S.lease)}catch(e){err(e)}};
function err(e){const c=document.createElement('div');c.className='card err';c.textContent='操作失败：'+(e&&e.message||e);$('#app').prepend(c);setTimeout(()=>c.remove(),4000)}
function bindChrome(){$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b)return;view=b.dataset.v;[...$('#nav').children].forEach(x=>x.classList.toggle('on',x===b));render()});bindSheet()}
bindChrome();
function renderPair(){reconnectAttempts=99;clearTimeout(reconnectTimer);document.body.innerHTML=`<main><section class="card"><h2>配对</h2><div class="hint">在主机 GUI「添加远程设备」生成 5 分钟配对码,输入下方。</div><input id="code" placeholder="配对码" style="margin:8px 0"><button id="go">配对并连接</button><div id="pe" class="err" style="margin-top:8px"></div></section></main>`;
 const go=()=>{const el=document.getElementById('go');el.disabled=true;fetch('/pair',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({challenge:document.getElementById('code').value.trim()})}).then(async r=>{const b=await r.json().catch(()=>null);if(!r.ok||!b||b.error)throw new Error((b&&b.error)||('HTTP'+r.status));document.body.innerHTML=CHROME;bindChrome();reconnectAttempts=0;connect();}).catch(e=>{document.getElementById('pe').textContent='配对失败:'+e.message;el.disabled=false})};
 document.getElementById('go').onclick=go;}
// K01:不读 HttpOnly cookie;先尝试带 cookie 的已认证 WSS,未认证(onclose 4003/4004)再显示配对。
connect();

</script></body></html>
